<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExeuδVR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%;
                 background: #0e0e10; font-family: system-ui, sans-serif; color: #e8e8e8; }
    #app-frame { position: fixed; inset: 0; width: 100%; height: 100%;
                 border: none; display: block; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 1.25rem;
               background: #0e0e10; z-index: 10; }
    #overlay.hidden { display: none; }
    h1   { font-size: 2rem; margin: 0; letter-spacing: .05em; }
    p    { margin: 0; color: #aaa; text-align: center; max-width: 28rem; }
    button { padding: .65rem 1.8rem; background: #6c47ff; color: #fff; border: none;
             border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover  { background: #8a6aff; }
    button:disabled { opacity: .5; cursor: default; }
    #status { font-size: .9rem; color: #aaa; min-height: 1.2em; text-align: center; }
  </style>
</head>
<body>
  <iframe id="app-frame" src="${FRONTEND_URL}" title="ExeuδVR"
          onload="onFrameLoad()" onerror="showOverlay()"></iframe>

  <div id="overlay">
    <h1>Exeu&#x03B4;VR</h1>
    <p>The replica is offline. It runs for ~10 minutes per session to avoid waste.</p>
    <button id="wakeBtn" onclick="wake()">Wake up replica (~10 min)</button>
    <div id="status"></div>
    <p style="font-size:.8rem">Once triggered, allow ~5 minutes then reload.</p>
  </div>

  <script>
    const CANISTER_URL = '${FRONTEND_URL}';

    function onFrameLoad() {
      try {
        const doc = document.getElementById('app-frame').contentDocument;
        if (doc && doc.title && doc.title !== '') {
          document.getElementById('overlay').classList.add('hidden');
          return;
        }
      } catch(e) {}
      showOverlay();
    }

    function showOverlay() {
      document.getElementById('overlay').classList.remove('hidden');
    }

    fetch(CANISTER_URL, { method: 'HEAD', mode: 'no-cors' })
      .then(() => document.getElementById('overlay').classList.add('hidden'))
      .catch(() => showOverlay());

    async function wake() {
      const btn    = document.getElementById('wakeBtn');
      const status = document.getElementById('status');
      const token  = prompt('GitHub PAT (actions:write scope):');
      if (!token) return;
      btn.disabled = true;
      status.textContent = 'Triggering workflow…';
      try {
        const res = await fetch(
          'https://api.github.com/repos/Exeud/exeudvr-canister/actions/workflows/deploy-pages.yml/dispatches',
          { method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token,
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json' },
            body: JSON.stringify({ ref: 'develop', inputs: { target: 'pages' } }) }
        );
        if (res.status === 204) {
          status.textContent = '✅ Triggered! Reload in ~5 minutes.';
        } else {
          const body = await res.json().catch(() => ({}));
          status.textContent = '❌ ' + (body.message || 'HTTP ' + res.status);
          btn.disabled = false;
        }
      } catch (e) {
        status.textContent = '❌ ' + e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
