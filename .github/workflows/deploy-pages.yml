name: Deploy to GitHub Pages

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "pages"
        type: choice
        options:
          - playground
          - pages

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Playground: deploy backend+frontend to IC Playground, redirect Pages to it ──
  deploy-playground:
    if: ${{ (github.event_name == 'push' && vars.DEPLOY_TARGET == 'playground') || inputs.target == 'playground' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dfx
      uses: dfinity/setup-dfx@main
      with:
        dfx-version: "0.24.3"

    - name: Install dependencies
      run: npm i

    - name: Create canisters on playground
      run: dfx canister create --all --network playground

    - name: Read canister IDs
      id: canister_ids
      run: |
        BACKEND_ID=$(dfx canister id backend --network playground)
        FRONTEND_ID=$(dfx canister id frontend --network playground)
        echo "backend_id=$BACKEND_ID" >> $GITHUB_OUTPUT
        echo "frontend_id=$FRONTEND_ID" >> $GITHUB_OUTPUT

    - name: Build frontend
      env:
        DFX_NETWORK: playground
        CANISTER_ID_BACKEND: ${{ steps.canister_ids.outputs.backend_id }}
        CANISTER_ID_FRONTEND: ${{ steps.canister_ids.outputs.frontend_id }}
        CANISTER_ID_INTERNET_IDENTITY: rdmx6-jaaaa-aaaaa-aaadq-cai
        NODE_ENV: production
      run: tsc && webpack --mode production

    - name: Deploy to playground
      run: dfx deploy --network playground backend frontend

    - name: Build Pages redirect
      run: |
        FRONTEND_URL="https://${{ steps.canister_ids.outputs.frontend_id }}.icp0.io"
        mkdir -p _site
        cat > _site/index.html << EOF
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=${FRONTEND_URL}" />
            <title>ExeuδVR</title>
          </head>
          <body>
            <p>Redirecting to <a href="${FRONTEND_URL}">${FRONTEND_URL}</a>…</p>
          </body>
        </html>
        EOF

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # ── Local replica: start dfx, deploy, tunnel via bore, redirect Pages to tunnel ──
  deploy-pages-only:
    if: ${{ (github.event_name == 'push' && vars.DEPLOY_TARGET != 'playground') || inputs.target == 'pages' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dfx
      uses: dfinity/setup-dfx@main
      with:
        dfx-version: "0.24.3"

    - name: Install dependencies and start replica
      run: |
        sudo apt-get install -y inotify-tools jq
        npm i
        dfx deps pull
        dfx start --clean --background
        dfx deps deploy
        dfx canister create backend
        dfx generate backend
        dfx canister create frontend
        dfx generate frontend

    - name: Build and deploy to local replica
      env:
        DFX_NETWORK: local
        CANISTER_ID_FRONTEND: bd3sg-teaaa-aaaaa-qaaba-cai
        CANISTER_ID_BACKEND: bkyz2-fmaaa-aaaaa-qaaaq-cai
        CANISTER_ID_INTERNET_IDENTITY: rdmx6-jaaaa-aaaaa-aaadq-cai
        NODE_ENV: production
      run: dfx deploy

    - name: Install bore and open tunnel
      id: tunnel
      run: |
        cargo install bore-cli
        bore local 4943 --to bore.pub > /tmp/bore.log 2>&1 &
        sleep 6
        REMOTE_PORT=$(grep -oP 'remote_port=\K[0-9]+' /tmp/bore.log \
          || grep -oP 'listening at bore\.pub:\K[0-9]+' /tmp/bore.log \
          || grep -oP 'port \K[0-9]+' /tmp/bore.log)
        echo "remote_port=$REMOTE_PORT" >> $GITHUB_OUTPUT
        echo "canister_url=http://bore.pub:${REMOTE_PORT}/?canisterId=bd3sg-teaaa-aaaaa-qaaba-cai" >> $GITHUB_OUTPUT

    - name: Build Pages redirect
      run: |
        FRONTEND_URL="${{ steps.tunnel.outputs.canister_url }}"
        mkdir -p _site
        cat > _site/index.html << HTMLEOF
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExeuδVR</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0e0e10; color: #e8e8e8;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; gap: 1.5rem; }
    h1 { font-size: 2rem; margin: 0; letter-spacing: .05em; }
    p  { margin: 0; color: #aaa; }
    a.launch { display: inline-block; padding: .75rem 2rem; background: #6c47ff;
               color: #fff; border-radius: 8px; text-decoration: none; font-size: 1.1rem;
               font-weight: 600; transition: background .2s; }
    a.launch:hover { background: #8a6aff; }
    button { padding: .65rem 1.8rem; background: #222; color: #e8e8e8; border: 1px solid #444;
             border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background .2s; }
    button:hover { background: #333; }
    button:disabled { opacity: .5; cursor: default; }
    #status { font-size: .9rem; color: #aaa; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Exeu&#x03B4;VR</h1>
  <a class="launch" href="${FRONTEND_URL}">Open App</a>
  <p>Replica is live for ~20 minutes after each deploy.</p>
  <div style="display:flex;flex-direction:column;align-items:center;gap:.75rem;margin-top:1rem">
    <button id="wakeBtn" onclick="wake()">Wake up replica (20 min)</button>
    <div id="status"></div>
  </div>
  <script>
    async function wake() {
      const btn = document.getElementById('wakeBtn');
      const status = document.getElementById('status');
      const token = prompt('GitHub PAT (actions:write scope):');
      if (!token) return;
      btn.disabled = true;
      status.textContent = 'Triggering workflow…';
      try {
        const res = await fetch(
          'https://api.github.com/repos/Exeud/exeudvr-canister/actions/workflows/deploy-pages.yml/dispatches',
          { method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token,
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json' },
            body: JSON.stringify({ ref: 'develop', inputs: { target: 'pages' } }) }
        );
        if (res.status === 204) {
          status.textContent = '✅ Workflow triggered! Allow ~5 min for the replica to come up, then reload.';
        } else {
          const body = await res.json().catch(() => ({}));
          status.textContent = '❌ ' + (body.message || 'HTTP ' + res.status);
          btn.disabled = false;
        }
      } catch(e) {
        status.textContent = '❌ ' + e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
HTMLEOF

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Keep replica and tunnel alive
      run: |
        MINUTES=${TUNNEL_MINUTES:-20}
        echo "Keeping tunnel alive for ${MINUTES} minutes..."
        echo "Visit: ${{ steps.tunnel.outputs.canister_url }}"
        sleep $((MINUTES * 60))
      env:
        TUNNEL_MINUTES: ${{ vars.TUNNEL_MINUTES }}
