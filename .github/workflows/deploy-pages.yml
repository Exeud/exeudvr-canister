name: Deploy to GitHub Pages

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "pages"
        type: choice
        options:
          - playground
          - pages

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Playground: deploy backend+frontend to IC Playground, redirect Pages to it ──
  deploy-playground:
    if: ${{ (github.event_name == 'push' && vars.DEPLOY_TARGET == 'playground') || inputs.target == 'playground' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dfx
      uses: dfinity/setup-dfx@main
      with:
        dfx-version: "0.24.3"

    - name: Install mops (provides moc)
      run: |
        npm i -g ic-mops
        mops install

    - name: Install dependencies
      run: npm i

    - name: Create canisters on playground
      run: dfx canister create --all --network playground

    - name: Read canister IDs
      id: canister_ids
      run: |
        BACKEND_ID=$(dfx canister id backend --network playground)
        FRONTEND_ID=$(dfx canister id frontend --network playground)
        echo "backend_id=$BACKEND_ID" >> $GITHUB_OUTPUT
        echo "frontend_id=$FRONTEND_ID" >> $GITHUB_OUTPUT

    - name: Build frontend
      env:
        DFX_NETWORK: playground
        CANISTER_ID_BACKEND: ${{ steps.canister_ids.outputs.backend_id }}
        CANISTER_ID_FRONTEND: ${{ steps.canister_ids.outputs.frontend_id }}
        CANISTER_ID_INTERNET_IDENTITY: rdmx6-jaaaa-aaaaa-aaadq-cai
        NODE_ENV: production
      run: tsc && webpack --mode production

    - name: Deploy to playground
      run: dfx deploy --network playground backend frontend

    - name: Build Pages redirect
      run: |
        mkdir -p _site
        FRONTEND_URL="https://${{ steps.canister_ids.outputs.frontend_id }}.icp0.io" \
          envsubst '$FRONTEND_URL' < .github/pages/redirect.html > _site/index.html

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # ── Local replica: start dfx, deploy, tunnel via bore, redirect Pages to tunnel ──
  deploy-pages-only:
    if: ${{ (github.event_name == 'push' && vars.DEPLOY_TARGET != 'playground') || inputs.target == 'pages' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dfx
      uses: dfinity/setup-dfx@main
      with:
        dfx-version: "0.24.3"

    - name: Install mops
      run: |
        npm i -g ic-mops
        mops install

    - name: Install dependencies and start replica
      run: |
        sudo apt-get install -y inotify-tools jq
        npm i
        dfx deps pull
        dfx start --clean --background
        dfx deps deploy
        dfx canister create backend
        dfx generate backend
        dfx canister create frontend
        dfx build

    - name: Build and deploy to local replica
      env:
        DFX_NETWORK: local
        CANISTER_ID_FRONTEND: bd3sg-teaaa-aaaaa-qaaba-cai
        CANISTER_ID_BACKEND: bkyz2-fmaaa-aaaaa-qaaaq-cai
        CANISTER_ID_INTERNET_IDENTITY: rdmx6-jaaaa-aaaaa-aaadq-cai
        NODE_ENV: production
      run: npm run build && dfx deploy

    - name: Build Pages site
      run: |
        mkdir -p _site
        FRONTEND_URL="http://bd3sg-teaaa-aaaaa-qaaba-cai.localhost:4943/" \
          envsubst '$FRONTEND_URL' < .github/pages/index.html > _site/index.html

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Keep replica alive
      run: |
        MINUTES=${TUNNEL_MINUTES:-10}
        echo "Keeping replica alive for ${MINUTES} minutes..."
        echo "Visit: https://exeud.github.io/exeudvr-canister/"
        sleep $((MINUTES * 60))
      env:
        TUNNEL_MINUTES: ${{ vars.TUNNEL_MINUTES }}
